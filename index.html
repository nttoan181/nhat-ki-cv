        @media(max-width:1000px){

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">

            <h1>WorkLog Blockchain</h1>

            <p>
                Hệ thống nhật ký công việc bằng Blockchain
            </p>

        </div>

        <div class="wallet-box">

            <button
                class="btn-secondary"
                onclick="connectWallet()"
            >
                Kết nối MetaMask
            </button>

            <div
                id="wallet"
                class="wallet-address"
            >
                Chưa kết nối ví
            </div>

        </div>

    </div>

    <div class="grid">

        <!-- LEFT -->

        <div class="card">

            <h2>Thêm công việc</h2>

            <input
                type="text"
                id="taskId"
                placeholder="Nhập Task ID"
            >

            <textarea
                id="description"
                placeholder="Mô tả công việc..."
            ></textarea>

            <select id="status">

                <option value="Pending">
                    Pending
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>

            <input
                type="file"
                id="taskImage"
                accept="image/*"
            >

            <button
                class="btn-primary"
                onclick="addTask()"
            >
                Lưu công việc
            </button>

        </div>

        <!-- RIGHT -->

        <div class="card">

            <h2>Blockchain Data</h2>

            <button
                class="btn-secondary"
                onclick="loadBlockchain()"
            >
                Tải Blockchain
            </button>

            <button
                class="btn-secondary"
                onclick="downloadDatabase()"
                style="margin-left:0;"
            >
                Tải DB
            </button>

            <div
                id="blockchainData"
                class="block-list"
            ></div>

        </div>

    </div>

</div>

<script>

let provider;

let signer;

let contract;

const contractAddress =
"0x87BA703f25Fa9C75C7410f3a1D25272CFe0Bc37F";

const serverUrl = 'http://127.0.0.1:3000';

const contractABI = [
	{
		"inputs": [
			{
				"internalType": "string",
				"name": "taskId",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "status",
				"type": "string"
			}
		],
		"name": "addTask",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"anonymous": false,
		"inputs": [
			{
				"indexed": true,
				"internalType": "uint256",
				"name": "id",
				"type": "uint256"
			},
			{
				"indexed": false,
				"internalType": "string",
				"name": "taskId",
				"type": "string"
			},
			{
				"indexed": false,
				"internalType": "string",
				"name": "status",
				"type": "string"
			},
			{
				"indexed": false,
				"internalType": "uint256",
				"name": "timestamp",
				"type": "uint256"
			},
			{
				"indexed": true,
				"internalType": "address",
				"name": "user",
				"type": "address"
			},
			{
				"indexed": false,
				"internalType": "bytes32",
				"name": "hash",
				"type": "bytes32"
			}
		],
		"name": "TaskAdded",
		"type": "event"
	},
	{
		"stateMutability": "payable",
		"type": "fallback"
	},
	{
		"stateMutability": "payable",
		"type": "receive"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "id",
				"type": "uint256"
			}
		],
		"name": "getTask",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			},
			{
				"internalType": "string",
				"name": "",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "",
				"type": "string"
			},
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			},
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			},
			{
				"internalType": "bytes32",
				"name": "",
				"type": "bytes32"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "taskCount",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "id",
				"type": "uint256"
			}
		],
		"name": "taskExists",
		"outputs": [
			{
				"internalType": "bool",
				"name": "",
				"type": "bool"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
]

// CONNECT METAMASK

async function connectWallet(){

    try{

        if(typeof window.ethereum === "undefined"){

            alert("Hãy cài MetaMask");

            return;
        }

        await window.ethereum.request({

            method:"eth_requestAccounts"

        });

        provider =
            new ethers.providers.Web3Provider(
                window.ethereum
            );

        signer =
            provider.getSigner();

        const network = await provider.getNetwork();

        const contractCode =
            await provider.getCode(contractAddress);

        if(contractCode === "0x"){
            alert(
                "Không tìm thấy contract trên mạng hiện tại. " +
                "Hãy chuyển MetaMask sang mạng đúng."
            );
            document.getElementById("wallet").innerHTML =
                `${await signer.getAddress()} (${network.name})`;
            return;
        }

        contract =
            new ethers.Contract(
                contractAddress,
                contractABI,
                signer
            );

        const address =
            await signer.getAddress();

        document.getElementById("wallet")
        .innerHTML = `${address} (${network.name})`;

        alert("Kết nối MetaMask thành công");

        loadBlockchain();

    }catch(err){

        console.log(err);

        alert("Lỗi kết nối MetaMask");
    }
}

// ADD TASK

async function addTask(){

    if(!contract){

        alert("Hãy kết nối MetaMask");

        return;
    }

    const taskId =
        document.getElementById("taskId").value;

    const status =
        document.getElementById("status").value;

    const description =
        document.getElementById("description").value;

    const taskImage =
        document.getElementById("taskImage").files[0];

    if(taskId.trim() === ""){

        alert("Nhập Task ID");

        return;
    }

    try{

        // 1) Ước lượng gas an toàn từ provider
        let gasEstimate;
        try{
            gasEstimate = await contract.estimateGas.addTask(taskId, status);
        }catch(e){
            console.warn('estimateGas failed, falling back to default', e);
            gasEstimate = ethers.BigNumber.from('100000');
        }

        // 2) Thêm đệm 20% cho gasLimit
        const gasLimit = gasEstimate.mul(120).div(100);

        const tx = await contract.addTask(taskId, status, { gasLimit });

        console.log('tx sent', tx);
        alert('Đang xử lý giao dịch...');

        const receipt = await tx.wait();

        console.log('tx receipt', receipt);

        let uploadError = null;

        try {
            const uploadData = new FormData();
            uploadData.append('taskId', taskId);
            uploadData.append('status', status);
            uploadData.append('description', description);
            if (taskImage) {
                uploadData.append('file', taskImage);
            }

            const uploadResponse = await fetch(`${serverUrl}/upload`, {
                method: 'POST',
                body: uploadData,
            });

            if (!uploadResponse.ok) {
                const errorJson = await uploadResponse.json().catch(() => null);
                const errorMessage = errorJson?.error || uploadResponse.statusText;
                uploadError = new Error(errorMessage);
            }
        } catch (uploadErr) {
            uploadError = uploadErr;
        }

        if (uploadError) {
            console.warn('Upload lỗi:', uploadError);
            alert('Giao dịch blockchain thành công nhưng upload ảnh thất bại: ' + uploadError.message);
        } else {
            alert('Lưu công việc và ảnh thành công');
        }

        document.getElementById('taskId').value = '';
        document.getElementById('description').value = '';
        document.getElementById('taskImage').value = '';

        loadBlockchain();

    }catch(err){

        console.error('Giao dịch lỗi', err);

        let reason = err?.reason || err?.message || '';
        if(!reason && err?.error && err.error.message) reason = err.error.message;
        if(!reason && err?.data && err.data.message) reason = err.data.message;

        alert('Lỗi giao dịch:\n' + reason);
    }
}



// LOAD BLOCKCHAIN

async function loadBlockchain(){

    if(!contract){

        return;
    }

    try{

        const count =
            await contract.taskCount();
        let serverTasks = [];
        try {
            const serverTasksResponse = await fetch(`${serverUrl}/tasks`);
            serverTasks = serverTasksResponse.ok ? await serverTasksResponse.json() : [];
        } catch (serverFetchError) {
            console.warn('Không thể lấy task từ server:', serverFetchError);
        }
        const serverTaskMap = {};
        serverTasks.forEach(row => {
            if (!row.taskId) return;
            if (!serverTaskMap[row.taskId] || row.timestamp > serverTaskMap[row.taskId].timestamp) {
                serverTaskMap[row.taskId] = row;
            }
        });
        let html = "";

        for(
            let i = Number(count);
            i >= 1;
            i--
        ){

            const task =
                await contract.getTask(i);

            const date =
                new Date(
                    Number(task[3]) * 1000
                );

            let statusClass = "pending";

            if(task[2] === "In Progress"){

                statusClass = "progress";
            }

            if(task[2] === "Completed"){

                statusClass = "completed";
            }

            html += `

            <div class="block">

                <div class="block-header">

                    <h3>
                        #${task[0]}
                    </h3>

                    <div class="badge ${statusClass}">
                        ${task[2]}
                    </div>

                </div>

                <div class="info">

                    <p>
                        <b>Task ID:</b>
                        ${task[1]}
                    </p>

                    <p>
                        <b>Người cập nhật:</b>
                        ${task[4]}
                    </p>

                    <p>
                        <b>Thời gian:</b>
                        ${date.toLocaleString()}
                    </p>

                    ${serverTaskMap[task[1]]?.description ? `
                    <p>
                        <b>Mô tả:</b>
                        ${serverTaskMap[task[1]].description}
                    </p>
                    ` : ''}

                </div>

                ${serverTaskMap[task[1]]?.imageUrl ? `
                <div class="task-image">
                    <img src="${serverUrl}${serverTaskMap[task[1]].imageUrl}" alt="Ảnh cập nhật">
                </div>
                ` : ''}

                <div class="hash">

                    <b>Hash:</b><br>

                    ${task[5]}

                </div>

            </div>

            `;
        }

        if (!html.trim() && Object.keys(serverTaskMap).length) {
            html = Object.values(serverTaskMap).map(row => `
                <div class="block">
                    <div class="block-header">
                        <h3>#${row.taskId}</h3>
                        <div class="badge ${row.status === 'Completed' ? 'completed' : row.status === 'In Progress' ? 'progress' : 'pending'}">
                            ${row.status || 'Pending'}
                        </div>
                    </div>
                    <div class="info">
                        <p><b>Task ID:</b> ${row.taskId}</p>
                        ${row.description ? `<p><b>Mô tả:</b> ${row.description}</p>` : ''}
                        <p><b>Thời gian:</b> ${new Date(row.timestamp).toLocaleString()}</p>
                    </div>
                    ${row.imageUrl ? `<div class="task-image"><img src="${serverUrl}${row.imageUrl}" alt="Ảnh cập nhật"></div>` : ''}
                </div>
            `).join('');
        }

        document.getElementById(
            "blockchainData"
        ).innerHTML = html;

    }catch(err){

        console.log(err);
    }
}

// Download database from server
function downloadDatabase(){
    const link = document.createElement('a');
    link.href = 'http://127.0.0.1:3000/download-db';
    link.download = 'worklog-tasks.db';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

</script>

</body>
</html>
